name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          sdkmanager --install "platform-tools" \
                     "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Sign the release APK with the debug keystore so it is INSTALLABLE.
      # An unsigned APK fails at install with INSTALL_PARSE_FAILED_NO_CERTIFICATES.
      - name: Sign release APK (debug key)
        run: |
          ls app/build/outputs/apk/release/
          DEBUGKEY=~/.android/debug.keystore
          if [ ! -f "$DEBUGKEY" ]; then
            keytool -genkeypair -v -keystore "$DEBUGKEY" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner sign \
            --ks "$DEBUGKEY" --ks-key-alias androiddebugkey \
            --ks-pass:android --key-pass:android \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/app-release-signed.apk
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify \
            --print-certs app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusLyrics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusLyrics-release
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-signed.apk
          generate_release_notes: true