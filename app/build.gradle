plugins {
    id 'com.android.application'
}

android {
    namespace 'com.term.statuslyrics'
    compileSdk 36

    defaultConfig {
        applicationId "com.term.statuslyrics"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('libs/xposed-api.jar')
}